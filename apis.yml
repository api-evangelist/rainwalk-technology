aid: rainwalk-technology
name: Rainwalk Technology
description: >-
  Rainwalk Technology is a white-label, embedded pet insurance provider founded
  in 2018 and based in Columbia, South Carolina. Rainwalk lets partners such as
  shelters, breeders, veterinary practices, and consumer platforms launch and
  distribute accident-and-illness pet insurance directly at the point of sale
  through its APIs and hosted quoting/enrollment flows, keeping partners in
  control of the customer experience. Coverage includes accidents, illnesses,
  diagnostics, surgery, and medications, with hassle-free reimbursements and free
  virtual vet consultations. The company operates a partner/embedded API surface
  (api.rainwalk.io) plus hosted quoting, insured, and agent portals, and is backed
  by Techstars Ventures, ManchesterStory, Insurtech Gateway, Bridge Capital, and
  Seaplane Ventures. Rainwalk was added to the API Evangelist network as a
  Techstars portfolio company and enriched via the pipeline.
